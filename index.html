    <script>
      // 还原 GitHub Pages 404 回退脚本编码的前端路由。
      (function restoreGithubPagesRoute(location) {
        if (location.search.startsWith("?/")) {
          const route = location.search
            .slice(1)
            .split("&")
            .map((part) => part.replaceAll("~and~", "&"))
            .join("?");
          window.history.replaceState(
            null,
            "",
            `${location.pathname.slice(0, -1)}${route}${location.hash}`,
          );
        }
      })(window.location);
    </script>
