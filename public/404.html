<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正在返回岭南辑造</title>
    <script>
      // 将 GitHub Pages 的深层路径编码回应用入口，由 index.html 恢复路由。
      (function redirectToApplication(location) {
        const pathSegmentsToKeep = 1;
        const repositoryRoot = location.pathname
          .split("/")
          .slice(0, pathSegmentsToKeep + 1)
          .join("/");
        const routePath = location.pathname
          .slice(1)
          .split("/")
          .slice(pathSegmentsToKeep)
          .join("/")
          .replaceAll("&", "~and~");
        const routeQuery = location.search
          ? `&${location.search.slice(1).replaceAll("&", "~and~")}`
          : "";

        location.replace(
          `${location.protocol}//${location.host}${repositoryRoot}/?/${routePath}${routeQuery}${location.hash}`,
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
